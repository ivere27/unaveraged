name: Build, test, and release

on:
  push:
    branches:
      - 'main'
      - 'master'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      release_nightly:
        description: 'Update the rolling nightly pre-release after build (default branch only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Validate release tag matches package and extension versions
        shell: bash
        run: python3 shared/release.py check-tag --tag "${GITHUB_REF_NAME}"

  build:
    needs: [preflight]
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            docs/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build and test dependencies
        run: make deps .venv/.docs-deps
      - name: Install headless browser dependencies and browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk \
            fonts-liberation \
            libasound2t64 \
            libdbus-glib-1-2 \
            libgtk-3-0 \
            libnss3 \
            libx11-xcb1 \
            libxtst6 \
            xdg-utils
          mkdir -p "$HOME/.cache/puppeteer"
          sudo env "PUPPETEER_CACHE_DIR=$HOME/.cache/puppeteer" ./node_modules/.bin/puppeteer browsers install chrome --install-deps
          sudo env "PUPPETEER_CACHE_DIR=$HOME/.cache/puppeteer" ./node_modules/.bin/puppeteer browsers install firefox --install-deps
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/puppeteer"
      - name: Cache quantized models
        id: model-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/cache@v4
        with:
          path: |
            .cache/digit
            .cache/vqa
          key: ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-models-v1-${{ hashFiles('requirements.txt', 'shared/build.py', 'shared/cpu_policy.py', 'shared/model_support.py', 'digit/*.py', 'digit/*.json', 'vqa/*.py', 'vqa/*.json', 'synth/**') }}
      - name: Build default quantized models and browser packages
        env:
          CACHE_HIT: ${{ steps.model-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            make package "JOBS=$(nproc)"
          else
            make "JOBS=$(nproc)"
          fi
      - name: Run full verification suite
        run: make test
      - name: Stage Pages demo and run browser smoke test
        run: |
          make pages
          npm run test:example
      - name: Validate production packages and source archive
        run: |
          make release ACTION=check
          make source
          .venv/bin/python shared/release.py stage-ci --out release-dist --include-source
      - name: Upload verified release packages
        uses: actions/upload-artifact@v4
        with:
          name: unaveraged-packages
          if-no-files-found: error
          path: release-dist
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: ignore
          path: test-results

  release:
    needs: [build]
    concurrency:
      group: ${{ github.workflow }}-release-${{ startsWith(github.ref, 'refs/tags/') && github.ref || 'nightly' }}
      cancel-in-progress: false
    if: >-
      !cancelled() && needs.build.result == 'success' && (
        (github.event_name == 'push' && (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          startsWith(github.ref, 'refs/tags/v')
        )) ||
        (github.event_name == 'workflow_dispatch' && inputs.release_nightly == true && (
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master'
        ))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: unaveraged-packages
          path: release-dist
      - name: Publish rolling nightly pre-release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 shared/release.py release-ci \
            --channel nightly \
            --dist release-dist \
            --sha "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --require-source \
            --require-checksums
      - name: Publish versioned stable release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 shared/release.py release-ci \
            --channel stable \
            --tag "${GITHUB_REF_NAME}" \
            --dist release-dist \
            --sha "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --require-source \
            --require-checksums

  publish-cws:
    needs: [release]
    environment: chrome-web-store
    concurrency:
      group: ${{ github.workflow }}-cws
      cancel-in-progress: false
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: unaveraged-packages
          path: release-dist
      - name: Verify staged release archives match tag
        run: |
          python3 shared/release.py verify-ci \
            --tag "${GITHUB_REF_NAME}" \
            --dist release-dist \
            --require-source \
            --require-checksums
      - name: Upload and submit Chrome packages to Chrome Web Store
        shell: bash
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${CWS_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "Error: secrets.CWS_SERVICE_ACCOUNT_JSON is not set in the chrome-web-store environment." >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/cws-service-account.json"
          trap 'rm -f "${key_file}"' EXIT
          umask 077
          printf '%s' "${CWS_SERVICE_ACCOUNT_JSON}" > "${key_file}"
          unset CWS_SERVICE_ACCOUNT_JSON
          node shared/cws.mjs publish-ci \
            --tag "${GITHUB_REF_NAME}" \
            --dist release-dist \
            --key-file "${key_file}" \
            --require-checksums
